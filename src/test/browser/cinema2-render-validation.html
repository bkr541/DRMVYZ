<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinema 2.0 render validation (developer only)</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02050a; color: #cfe8ff; font: 12px system-ui, sans-serif; }
      #cinema2-render-validation { display: block; width: 100%; height: 100%; }
      #rv-controls { position: fixed; top: 8px; left: 8px; padding: 8px 10px; background: rgba(8, 12, 20, 0.86); border: 1px solid #1f2a3a; border-radius: 6px; display: grid; gap: 6px; min-width: 190px; }
      #rv-controls[hidden] { display: none; }
      #rv-controls label { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
      #rv-controls h1 { margin: 0 0 2px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #8fb4d8; }
      #rv-stats { white-space: pre; font: 11px ui-monospace, monospace; color: #9fc0e0; }
    </style>
  </head>
  <body>
    <canvas id="cinema2-render-validation"></canvas>
    <div id="rv-controls" hidden></div>
    <script type="module" src="./Cinema2RenderValidationHarness.ts"></script>
  </body>
</html>
