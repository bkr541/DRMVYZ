<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATL HOE visual acceptance</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02050a; }
      #atl-hoe-capture-frame { position: relative; width: 100%; height: 100%; }
      #atl-hoe-capture { display: block; width: 100%; height: 100%; }
      #atl-hoe-reference-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="atl-hoe-capture-frame">
      <canvas id="atl-hoe-capture"></canvas>
      <img id="atl-hoe-reference-overlay" alt="Development-only ATL HOE reference overlay" hidden />
    </div>
    <script type="module" src="./Cinema2AtlHoeVisualAcceptanceBrowserHarness.ts"></script>
  </body>
</html>
