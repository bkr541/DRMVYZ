name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Unit / Build / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Clean locked install
        run: npm ci

      - name: Repository hygiene
        run: npm run repo:hygiene

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Native Node tests
        run: npm run test:native

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit (high and critical block)
        run: npm run audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Clean locked install
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e-smoke:
    name: E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Clean locked install
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run playwright:install:ci

      - name: Build app
        run: npm run build

      - name: Run Chromium smoke tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
