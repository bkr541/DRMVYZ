name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Unit / Build / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Clean locked install
        run: npm ci

      - name: Repository hygiene
        run: npm run repo:hygiene

      - name: Asset governance
        run: npm run audit:assets -- --check && npm run test:asset-governance

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Cinema 2.0 release policy tests
        run: npm run test:cinema2:release-policy

      - name: Native Node tests
        run: npm run test:native

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit (high and critical block)
        run: npm run audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Clean locked install
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e-smoke:
    name: E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Clean locked install
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run playwright:install:ci

      - name: Build app
        run: npm run build

      - name: Run Chromium smoke tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  cinema2-release:
    # Full production canvas matrix is a deliberate release operation, not a
    # 15-minute smoke test. Software/hardware identity is recorded in evidence.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run playwright:install:ci
      - run: npm run test:e2e:cinema2-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema2-release-evidence
          path: artifacts/cinema2-release/
          if-no-files-found: warn
          retention-days: 7
